# --- Tento blok zachytí HTTP provoz na portu 80 ---
<VirtualHost *:80>
    ServerName vaha.micharnaubusinek.cz

    # Trvale přesměruje (301) VŠECHNO (/) na stejnou adresu, ale s HTTPS
    Redirect permanent / https://vaha.micharnaubusinek.cz/
</VirtualHost>

<VirtualHost *:443>
    ServerName vaha.micharnaubusinek.cz
    DocumentRoot /var/www/vaha

    # --- Hesla pro appku (config.php) - SEM DEJ SKUTEČNÉ HODNOTY, ne do gitu ---
    SetEnv VAHA_DB_PASS "zmen-me"
    SetEnv VAHA_ADMIN_PASSWORD "zmen-me"
    SetEnv VAHA_MEDIAMTX_API_USER "zmen-me"
    SetEnv VAHA_MEDIAMTX_API_PASS "zmen-me"

    # --- SSL nastavení ---
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/kamera.micharnaubusinek.cz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/kamera.micharnaubusinek.cz/privkey.pem


    <Directory /var/www/vaha>
        # Povolí .htaccess soubory
        AllowOverride All
        # Povolí přístup
        Require all denied
        Require ip 127.0.0.1
        Require ip 192.168.93.0/24
        Require ip 192.168.1.0/24
	Require ip 172.20.2.0/24
        # Require all granted
    </Directory>

    # --- WHEP proxy pro kamery - stejná doména jako appka, takže prohlížeč
    # nepotřebuje CORS (na rozdíl od proxování přes kamera.micharnaubusinek.cz).
    # Generické pravidlo pokrývá libovolné jméno kamery (cam1, cam2, ...),
    # nová kamera z admin.html/DB tedy funguje bez úpravy Apache configu.
    ProxyRequests Off
    ProxyPreserveHost On
    RewriteEngine On

    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/([A-Za-z0-9_-]+)/whep/?$ ws://192.168.93.80:8889/$1/whep [P,L]

    ProxyPassMatch ^/([A-Za-z0-9_-]+)/whep$ http://192.168.93.80:8889/$1/whep

    <LocationMatch "^/[A-Za-z0-9_-]+/whep$">
        Require all denied
        Require ip 127.0.0.1
        Require ip 192.168.93.0/24
        Require ip 192.168.1.0/24
        Require ip 172.20.2.0/24
    </LocationMatch>

    # Cesty k logovacím souborům
    ErrorLog ${APACHE_LOG_DIR}/vaha-error.log
    CustomLog ${APACHE_LOG_DIR}/vaha-access.log combined
</VirtualHost>
